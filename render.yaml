# Render Blueprint — Undercut eBay repricer backend (API + Postgres + Redis).
# Dashboard (Next.js) deploys separately on Vercel (set API_URL to the API service URL).
# Secrets (sync:false) are entered once in the Render dashboard.
# NOTE: scheduling runs via GitHub Actions crons hitting key-protected endpoints
# (reprice every 15 min, lifecycle emails + ops digest daily, health check every
# 10 min) — the old celery worker/beat services were removed 2026-06-10 (~$20/mo).
# GOTCHA: the api service reads SERVICE-level env vars, not this group — set
# secrets at the service level in the dashboard and redeploy.

databases:
  - name: undercut-db
    databaseName: undercut
    user: undercut
    plan: basic-256mb

services:
  - type: keyvalue
    name: undercut-redis
    plan: free
    ipAllowList: []

  - type: web
    name: undercut-api
    runtime: python
    plan: starter
    buildCommand: pip install -r backend/requirements.txt
    preDeployCommand: "cd backend && python -m alembic upgrade head"
    startCommand: uvicorn backend.api.main:app --host 0.0.0.0 --port $PORT
    # Only rebuild when backend code/deps or this blueprint change. Content/frontend
    # pushes (dashboard/**, scripts/**, docs, markdown, workflows) skip the backend
    # build entirely — saves Render pipeline minutes on the weekly content-machine pushes.
    buildFilters:
      paths:
        - backend/**
        - render.yaml
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        fromDatabase: { name: undercut-db, property: connectionString }
      - key: REDIS_URL
        fromService: { type: keyvalue, name: undercut-redis, property: connectionString }
      - fromGroup: undercut-secrets

envVarGroups:
  - name: undercut-secrets
    envVars:
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_PRICE_STARTER
        sync: false
      - key: STRIPE_PRICE_PRO
        sync: false
      - key: STRIPE_PRICE_SCALE
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: EBAY_APP_ID
        sync: false
      - key: EBAY_CERT_ID
        sync: false
      - key: EBAY_DEV_ID
        sync: false
      - key: EBAY_USER_TOKEN
        sync: false
      - key: EBAY_RU_NAME
        sync: false
      - key: EBAY_SANDBOX
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: UNDERCUT_API_KEY        # copy this generated value into the dashboard's env too
        generateValue: true
      # Encrypts seller eBay OAuth tokens (sell.inventory WRITE) at rest. Paste a valid
      # Fernet key: python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
      # When ENVIRONMENT=production, crypto.py REFUSES to boot without a valid key here.
      - key: TOKEN_ENC_KEY
        sync: false
      # Flip to "production" to activate the fail-fast secret guards + mandatory token
      # encryption. Set TOKEN_ENC_KEY above FIRST, or the app will (intentionally) not boot.
      - key: ENVIRONMENT
        sync: false
