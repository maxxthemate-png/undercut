services:
  # Redis — local rate-limit/cache experiments only (prod throttling is in-memory)
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes

  # Postgres — application database (local dev; production uses Render Postgres)
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: undercut
    ports:
      - "5433:5432"   # host 5432 is taken by Homebrew Postgres; use 5433
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # FastAPI backend
  api:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - postgres
    volumes:
      - ./backend:/app
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload

  # (Celery worker/beat/flower services removed 2026-07-03: backend/tasks/ was
  # deleted in the ListingArb purge — they crash-looped on a missing module.
  # Prod scheduling = GitHub Actions crons hitting key-protected endpoints.)

  # Next.js dashboard
  dashboard:
    build:
      context: ./dashboard
      dockerfile: ../docker/Dockerfile.dashboard
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - API_URL=http://api:8000
    depends_on:
      - api

volumes:
  redis_data:
  postgres_data:
