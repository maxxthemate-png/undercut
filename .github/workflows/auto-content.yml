name: Auto content
# Autonomous SEO growth: weekly, generate the next backlog page via Claude,
# lint it, commit, and submit it to IndexNow. The IndexNow ping is done INLINE
# here (not via the separate IndexNow workflow) because a push made by the
# GITHUB_TOKEN does NOT trigger other workflows — so the cross-workflow chain
# silently no-ops for this bot. No human input — the only secret is
# ANTHROPIC_API_KEY (same key the backend uses). When the backlog is fully
# built it is a clean no-op (nothing committed, nothing submitted).

on:
  schedule:
    - cron: "0 8 * * 4" # weekly, Thursdays 08:00 UTC (offset from the Monday IndexNow refresh)
  workflow_dispatch:
    inputs:
      count:
        description: "How many pages to generate this run"
        required: false
        default: "1"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate next backlog page(s)
        id: gen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COUNT: ${{ github.event.inputs.count || '1' }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::warning::ANTHROPIC_API_KEY secret is not set — skipping content generation. Add it in repo Settings → Secrets → Actions to switch the content machine on."
            exit 0
          fi
          node scripts/generate-content.mjs

      - name: Lint generated content
        run: cd dashboard && node ../scripts/lint-content.mjs

      - name: Commit if anything changed
        id: commit
        run: |
          if git diff --quiet -- dashboard/app/_content; then
            echo "No content changes to commit (backlog built out or generation skipped)."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "undercut-content-bot"
          git config user.email "bot@users.noreply.github.com"
          git add dashboard/app/_content
          NEW=$(git diff --cached --name-only | tr '\n' ' ')
          git commit -m "Auto content: new SEO page(s) generated by the content machine" -m "Files: ${NEW}"
          git push
          echo "committed=true" >> "$GITHUB_OUTPUT"

      # The bot's push (GITHUB_TOKEN) won't trigger indexnow.yml, so submit here.
      # Wait for Vercel to deploy the new page into the live sitemap first; the
      # weekly IndexNow cron is the backstop if this fires a touch early.
      - name: Submit to IndexNow
        if: steps.commit.outputs.committed == 'true'
        run: |
          echo "Waiting for Vercel to deploy the new page into the live sitemap..."
          sleep 240
          node scripts/indexnow-ping.mjs
