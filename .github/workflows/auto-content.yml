name: Auto content
# Autonomous SEO growth: weekly, generate the next backlog page via Claude,
# lint it, and commit. The push to dashboard/** automatically triggers the
# IndexNow workflow, so new pages are submitted to search engines on their own.
# No human input — the only secret is ANTHROPIC_API_KEY (same key the backend uses).
# When the backlog is fully built it is a clean no-op (nothing committed).

on:
  schedule:
    - cron: "0 8 * * 4" # weekly, Thursdays 08:00 UTC (offset from the Monday IndexNow refresh)
  workflow_dispatch:
    inputs:
      count:
        description: "How many pages to generate this run"
        required: false
        default: "1"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate next backlog page(s)
        id: gen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COUNT: ${{ github.event.inputs.count || '1' }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::warning::ANTHROPIC_API_KEY secret is not set — skipping content generation. Add it in repo Settings → Secrets → Actions to switch the content machine on."
            exit 0
          fi
          node scripts/generate-content.mjs

      - name: Lint generated content
        run: cd dashboard && node ../scripts/lint-content.mjs

      - name: Commit if anything changed
        run: |
          if git diff --quiet -- dashboard/app/_content; then
            echo "No content changes to commit (backlog built out or generation skipped)."
            exit 0
          fi
          git config user.name "undercut-content-bot"
          git config user.email "bot@users.noreply.github.com"
          git add dashboard/app/_content
          NEW=$(git diff --cached --name-only | tr '\n' ' ')
          # No [skip ci]: the push to dashboard/** must trigger the IndexNow
          # workflow so the new pages get submitted to search engines.
          git commit -m "Auto content: new SEO page(s) generated by the content machine" -m "Files: ${NEW}"
          git push
