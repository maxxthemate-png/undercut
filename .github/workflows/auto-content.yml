name: Auto content
# Autonomous SEO growth: weekly, generate the next backlog page via Claude,
# lint it, commit, and submit it to IndexNow. The IndexNow ping is done INLINE
# here (not via the separate IndexNow workflow) because a push made by the
# GITHUB_TOKEN does NOT trigger other workflows — so the cross-workflow chain
# silently no-ops for this bot. No human input — the only secret is
# ANTHROPIC_API_KEY (same key the backend uses). When the backlog is fully
# built it is a clean no-op (nothing committed, nothing submitted).

on:
  schedule:
    # Weekly, Thursdays 08:00 UTC. Deliberately NOT more often: the shared
    # ANTHROPIC_API_KEY hit its usage cap when this ran 2x/week, and indexation
    # (domain age + backlinks), not page count, is the actual SEO bottleneck —
    # a 3-week-old domain with 151 sitemap URLs is indexing none of them.
    - cron: "0 8 * * 4"
  workflow_dispatch:
    inputs:
      count:
        description: "How many pages to generate this run"
        required: false
        default: "1"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate next backlog page(s)
        id: gen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COUNT: ${{ github.event.inputs.count || '1' }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::warning::ANTHROPIC_API_KEY secret is not set — skipping content generation. Add it in repo Settings → Secrets → Actions to switch the content machine on."
            exit 0
          fi
          node scripts/generate-content.mjs

      - name: Lint generated content
        run: cd dashboard && node ../scripts/lint-content.mjs

      - name: Commit if anything changed
        id: commit
        run: |
          if git diff --quiet -- dashboard/app/_content; then
            echo "No content changes to commit (backlog built out or generation skipped)."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "undercut-content-bot"
          git config user.email "bot@users.noreply.github.com"
          git add dashboard/app/_content
          NEW=$(git diff --cached --name-only | tr '\n' ' ')
          git commit -m "Auto content: new SEO page(s) generated by the content machine" -m "Files: ${NEW}"
          git push
          echo "committed=true" >> "$GITHUB_OUTPUT"

      # Git->Vercel auto-deploy is not enabled on this project, so the new page
      # won't go live on its own. Deploy it here (synchronous: returns when READY).
      # Gated on VERCEL_TOKEN — until the owner adds that secret, the page is
      # committed but not published, and a manual `vercel --prod` ships it.
      - name: Deploy to Vercel
        id: deploy
        if: steps.commit.outputs.committed == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_PqNwcN0aoZVHZONfusUKK6sU
          VERCEL_PROJECT_ID: prj_C4SdJQsQxNmal55HNqemQcwxNcS2
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::warning::VERCEL_TOKEN not set — page committed but NOT published. Add it (repo Settings → Secrets → Actions) to auto-publish, or run 'vercel --prod' manually."
            echo "deployed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          npm i -g vercel@latest >/dev/null 2>&1
          cd dashboard
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel deploy --prod --yes --token="$VERCEL_TOKEN" -b API_URL=https://undercut-api.onrender.com
          echo "deployed=true" >> "$GITHUB_OUTPUT"

      # The bot's push (GITHUB_TOKEN) won't trigger indexnow.yml, so submit here.
      # If we deployed above, the page is already live; otherwise wait a bit in
      # case another deploy is in flight. The weekly IndexNow cron is the backstop.
      - name: Submit to IndexNow
        if: steps.commit.outputs.committed == 'true'
        run: |
          if [ "${{ steps.deploy.outputs.deployed }}" != "true" ]; then
            echo "No deploy ran here — waiting in case a deploy is in flight before submitting."
            sleep 180
          fi
          node scripts/indexnow-ping.mjs
